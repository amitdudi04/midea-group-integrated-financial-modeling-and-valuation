name: Publish and validate R4 exploratory research

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: "github.event.head_commit.message == 'research: request deterministic R4 generation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate alternate historical research outputs (no R3 overwrite)
        run: |
          python -B research_r4/rebuild_exploratory_revision.py
          python -B research_r4/verify_exploratory_revision.py
      - name: Recompute public release manifest after R4 outputs
        run: python -B verification/refresh_public_manifest.py
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Run independent financial and publication checks
        run: |
          python -B -m pytest -p no:cacheprovider tests/test_repository.py -q
          python -B verification/final_calculation_verifier.py
          python -B verification/independent_model_recalculator.py
          python -B verification/supplementary_stress_verifier.py
          python -B verification/end_to_end_verifier.py
          python -B research_r4/verify_exploratory_revision.py
      - name: Commit verified R4 artifacts and updated authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_r4/ release/REPOSITORY_MANIFEST_R3_1.json release/REPOSITORY_AUTHORITY_R3_1.json
          git diff --cached --quiet && { echo "No changes to publish"; exit 0; }
          git commit -m "research: publish verified experimental R4 economic scenarios"
          git push origin HEAD:main
