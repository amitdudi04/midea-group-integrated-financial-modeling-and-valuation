name: Publish corrected R4.1 date-convention evidence
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: "github.event.head_commit.message == 'research: request corrected R4.1 date-value publication'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate original R4 and corrected R4.1
        run: |
          python -B research_r4/rebuild_exploratory_revision.py
          python -B research_r4/verify_exploratory_revision.py
          python -B research_r4/linked_three_statement_extension.py
          python -B research_r4/verify_linked_three_statement.py
      - name: Refresh manifest and authority
        run: python -B verification/refresh_public_manifest.py
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify original R3 and revised R4/R4.1
        run: |
          python -B -m pytest -p no:cacheprovider tests/test_repository.py -q
          python -B verification/final_calculation_verifier.py
          python -B verification/independent_model_recalculator.py
          python -B verification/supplementary_stress_verifier.py
          python -B verification/end_to_end_verifier.py
          python -B research_r4/verify_linked_three_statement.py
      - name: Commit validated corrected numerical evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_r4/ release/REPOSITORY_MANIFEST_R3_1.json release/REPOSITORY_AUTHORITY_R3_1.json
          git diff --cached --quiet && { echo "No changed outputs"; exit 0; }
          git commit -m "research: correct R4.1 DCF discount periods and retain original R3"
          git push origin HEAD:main
