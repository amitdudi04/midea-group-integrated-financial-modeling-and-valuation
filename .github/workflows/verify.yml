name: verify-model
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -B -m pytest -p no:cacheprovider tests/test_repository.py -q
      - run: python -B verification/final_calculation_verifier.py
      - run: python -B verification/independent_model_recalculator.py
      - run: python -B verification/end_to_end_verifier.py
      - run: python -B verification/supplementary_stress_verifier.py
      - run: python -B research_r4/rebuild_exploratory_revision.py
      - run: python -B research_r4/verify_exploratory_revision.py
      - run: python -B research_r4/linked_three_statement_extension.py
      - run: python -B research_r4/verify_linked_three_statement.py
      - name: Ensure tracked R4 numerical outputs reproduce byte-for-byte
        run: |
          git diff --exit-code -- research_r4/
          test -z "$(git ls-files --others --exclude-standard research_r4/)"
