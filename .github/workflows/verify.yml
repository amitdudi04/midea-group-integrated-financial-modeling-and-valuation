name: verify-model
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -B -m pytest -p no:cacheprovider tests/test_repository.py -q
      - run: python -B verification/final_calculation_verifier.py
      - run: python -B verification/independent_model_recalculator.py
      - run: python -B verification/end_to_end_verifier.py
